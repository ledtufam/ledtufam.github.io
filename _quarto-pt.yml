# Perfil PORTUGUÊS (padrão): menu, rodapé e páginas em português
project:
  render:
    - "*.qmd"
    - "**/*.qmd"
    - "!en/"
    - "!es/"

lang: pt

website:
  description: "Laboratório de Ecologia e Dendrologia Tropical (LEDT) – Universidade Federal do Amazonas"
  navbar:
    title: false
    logo: assets/images/logos/logo_simples.png
    logo-alt: "LEDT – Laboratório de Ecologia e Dendrologia Tropical"
    left:
      - href: index.qmd
        text: Início
      - href: pessoas.qmd
        text: Pessoas
      - text: Ensino
        menu:
          - href: ensino/graduacao/disciplinas.qmd
            text: "Graduação"
          - href: ensino/posgraduacao/disciplinas.qmd
            text: "Pós-graduação"
      - text: Pesquisa
        menu:
          - href: pesquisa.qmd
            text: "Projetos e parcerias"
          - href: publicacoes.qmd
            text: "Publicações"
      - text: Extensão
        menu:
          - href: extensao.qmd
            text: "Projetos de extensão"
          - href: extensao/rlab/index.qmd
            text: "R Lab"
          - href: extensao/ferramentas.qmd
            text: "Ferramentas (FenoTree)"
          - href: divulgacaocientifica.qmd
            text: "Divulgação científica"
      - href: selecoes.qmd
        text: Seleções
      - text: Sobre
        menu:
          - href: sobre.qmd
            text: "O LEDT"
          - href: identidade-visual.qmd
            text: "Identidade visual"
      - href: contato.qmd
        text: Contato
    right:
      - icon: translate
        aria-label: "Idioma"
        menu:
          - text: "Português"
            href: https://ledtufam.github.io/
          - text: "English"
            href: https://ledtufam.github.io/en/
          - text: "Español"
            href: https://ledtufam.github.io/es/
      - icon: github
        href: https://github.com/ledtufam
        aria-label: GitHub
      - icon: instagram
        href: https://www.instagram.com/ledt_ufam/
        aria-label: Instagram
      - icon: youtube
        href: https://www.youtube.com/@ledt_ufam
        aria-label: YouTube

  page-footer:
    left: "© 2026 LEDT/UFAM. Todos os direitos reservados."
    right:
      - href: https://ccvasconcelos.github.io/
        text: Desenvolvido por Caroline C. Vasconcelos

format:
