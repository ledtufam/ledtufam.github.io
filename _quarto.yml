project:
  type: website
  output-dir: docs
  post-render: _idiomas.R   # gera docs/en e docs/es automaticamente

# ------------------------------------------------------------------
# IDIOMAS
# Este arquivo tem as configurações comuns aos 3 idiomas.
# O menu e o rodapé de cada idioma ficam em:
#   _quarto-pt.yml (padrão)  |  _quarto-en.yml  |  _quarto-es.yml
# As páginas traduzidas ficam nas pastas en/ e es/.
# Para gerar o site completo nos 3 idiomas: aba Build -> "Render Website"
# (ou source("render_site.R")). O script _idiomas.R faz o resto.
# ------------------------------------------------------------------
profile:
  default: pt

website:
  title: "LEDT"
  site-url: https://ledtufam.github.io
  favicon: assets/images/logos/favicon.ico
  image: assets/images/logos/logo_horizontal.png
  open-graph: true
  search: true

format:
  html:
    theme:
      light: minty
      dark: superhero
    css: styles.css
    lightbox: true
    toc: true
    toc-location: right
    code-copy: true
    code-overflow: wrap
    include-after-body: assets/html/idiomas.html

editor: visual
